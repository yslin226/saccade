[project]
name = "saccade-vision"
version = "0.1.0"
description = "Active vision agent — give VLMs a saccade system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "yslin226", email = "yslin226@gmail.com" },
]
keywords = ["vlm", "active-vision", "agent", "computer-vision", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pydantic-ai>=1.0",
    "pillow>=10",
    "numpy>=1.26",
]

# User-facing extras (pip install "saccade-vision[geometry]").
[project.optional-dependencies]
geometry = ["opencv-python>=4.10"]
observability = ["langfuse>=2"]

# Development dependencies (PEP 735). Never installed by users.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    # Benchmarks read GOOGLE_API_KEY from .env. Declared explicitly rather
    # than relied on as a transitive dependency of pydantic-ai.
    "python-dotenv>=1",
    # Penn Action ships its joint labels as MATLAB .mat files, which
    # scipy.io.loadmat reads. Never declared until a workspace sync
    # re-resolved the tree and removed it — it had been arriving as some
    # other package's transitive dependency, which is not a dependency.
    "scipy>=1.11",
    # The nine-feature classifier in pose_probe/learn.py, which scored AUROC
    # 0.42 — worse than chance. Kept so the negative result stays runnable.
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The applications live in this repo until their interface with the engine
# has stopped changing (spec 8.1). A workspace lets them depend on the local
# engine without a release, and splitting one out later is a folder move plus
# deleting its [tool.uv.sources] block.
[tool.uv.workspace]
members = ["apps/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/saccade"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Code blocks inside the spec and plans are illustrative sketches, not source.
# Reformatting them would rewrite approved documents.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
# No python_version pin: CI checks 3.11, 3.12 and 3.13, and mypy should
# check against whichever interpreter it is actually running under.

# Vision packages that ship no type stubs. cv2 is imported by the engine
# only to detect whether the geometry extra is installed; mediapipe and
# ultralytics are used by the application and the benchmarks, which rule 2
# keeps out of the engine entirely.
[[tool.mypy.overrides]]
module = ["cv2.*", "cv2", "mediapipe.*", "mediapipe", "ultralytics.*", "ultralytics"]
ignore_missing_imports = true
# ultralytics ships a py.typed marker but re-exports YOLO through a plain
# assignment rather than __all__, so a strict check calls the import an
# error. The symbol is the package's documented entry point.
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The apps are workspace members with their own test suites. Listing them
# here means `uv run pytest` at the root is the whole build — an acceptance
# condition that says "pytest is green" would otherwise be satisfied without
# the application having been tested at all.
testpaths = ["tests", "apps"]
# benchmarks/ is not installed as a package — it ships with the repo, not
# with saccade-vision — so the project root has to be importable for tests
# that exercise the benchmark pipeline.
pythonpath = ["."]
