[project]
name = "saccade-vision"
version = "0.1.0"
description = "Active vision agent — give VLMs a saccade system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "yslin226", email = "yslin226@gmail.com" },
]
keywords = ["vlm", "active-vision", "agent", "computer-vision", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pydantic-ai>=1.0",
    "pillow>=10",
    "numpy>=1.26",
]

# User-facing extras (pip install "saccade-vision[geometry]").
[project.optional-dependencies]
geometry = ["opencv-python>=4.10"]
observability = ["langfuse>=2"]

# Development dependencies (PEP 735). Never installed by users.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    # Benchmarks read GOOGLE_API_KEY from .env. Declared explicitly rather
    # than relied on as a transitive dependency of pydantic-ai.
    "python-dotenv>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saccade"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Code blocks inside the spec and plans are illustrative sketches, not source.
# Reformatting them would rewrite approved documents.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
# No python_version pin: CI checks 3.11, 3.12 and 3.13, and mypy should
# check against whichever interpreter it is actually running under.

# opencv-python ships no type stubs. The import in geometry/__init__.py
# exists only to detect whether the extra is installed.
[[tool.mypy.overrides]]
module = ["cv2.*", "cv2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# benchmarks/ is not installed as a package — it ships with the repo, not
# with saccade-vision — so the project root has to be importable for tests
# that exercise the benchmark pipeline.
pythonpath = ["."]
