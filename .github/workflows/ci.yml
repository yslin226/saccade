name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # Without this, every `uv run` re-reads .python-version (3.11), tears down
    # the environment the matrix just built, and recreates it without the
    # extras — so all three jobs silently run 3.11 and lose OpenCV.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Confirm the interpreter and extras under test
        run: |
          uv run python -c "import sys; print('python', sys.version)"
          uv run python -c "import cv2; print('opencv', cv2.__version__)"
          uv run python -c "import sys; assert sys.version_info[:2] == tuple(
              int(p) for p in '${{ matrix.python-version }}'.split('.')
          ), f'expected ${{ matrix.python-version }}, got {sys.version_info[:2]}'"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=saccade --cov-report=term-missing

      - name: Build
        run: uv build
